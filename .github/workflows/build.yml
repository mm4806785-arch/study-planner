name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create android project
        run: |
          flutter create --platforms=android --project-name study_planner --org com.study _app
          cp -f pubspec.yaml _app/pubspec.yaml
          rm -rf _app/lib _app/test && mkdir -p _app/lib
          cp *.dart _app/lib/
          if [ -d test ]; then cp -r test _app/test; fi
          sed -i 's/android:label="[^"]*"/android:label="مساحتك الأكاديمية"/' _app/android/app/src/main/AndroidManifest.xml
      - name: Analyze (informational)
        continue-on-error: true
        run: |
          cd _app
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests (informational)
        continue-on-error: true
        run: |
          cd _app
          flutter test
      - name: Build release APK
        run: |
          cd _app
          flutter build apk --release --build-number=$((100 + ${{ github.run_number }}))
      - name: Sign APK with fixed key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks release.jks --ks-key-alias studyplanner --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out study-planner.apk _app/build/app/outputs/flutter-apk/app-release.apk
          $APKSIGNER verify --print-certs study-planner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: study-planner-apk
          path: study-planner.apk
